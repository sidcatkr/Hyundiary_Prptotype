plugins {
    id 'com.android.application'
}

// release 서명 정보는 저장소에 넣지 않는다. android/keystore.properties(.gitignore 대상)에서 읽는다.
//   storeFile=/절대/경로/hyundiary-release.jks
//   storePassword=...
//   keyAlias=hyundiary
//   keyPassword=...
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { keystoreProps.getProperty(it) }

android {
    namespace 'com.hyundiary.mockup'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hyundiary.mockup'
        minSdk 28          // Pleos 제품 앱 기준(서명키 rotation)
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
                // minSdk 28: v2·v3 서명(v3는 서명키 rotation 지원)
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    sourceSets {
        main {
            // 웹 목업(저장소 루트의 web/)을 복사 없이 그대로 assets로 묶는다.
            // 앱은 assets의 app.html을 연다.
            assets.srcDirs = ['src/main/assets', '../../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 키가 없으면 서명 안 된 APK(app-release-unsigned.apk)가 나온다
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
