plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// release 서명 정보는 저장소에 넣지 않는다. android/keystore.properties(.gitignore 대상)에서 읽는다.
//   storeFile=/절대/경로/hyundiary-release.jks
//   storePassword=...
//   keyAlias=hyundiary
//   keyPassword=...
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { keystoreProps.getProperty(it) }

android {
    namespace 'com.hyundiary.mockup'
    compileSdk 35
    // AAOS Car API(CarPropertyManager, CarUxRestrictionsManager). 에뮬레이터가 API 34라 API 34에 있는 메서드만 쓴다.
    useLibrary 'android.car'

    defaultConfig {
        applicationId 'com.hyundiary.mockup'
        minSdk 28          // Pleos 제품 앱 기준(서명키 rotation)
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
                // minSdk 28: v2·v3 서명(v3는 서명키 rotation 지원)
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    sourceSets {
        main {
            // 웹 목업(저장소 루트의 web/)을 복사 없이 그대로 assets로 묶는다.
            // 앱은 assets의 app.html을 연다.
            assets.srcDirs = ['src/main/assets', '../../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 키가 없으면 서명 안 된 APK(app-release-unsigned.apk)가 나온다
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Pleos Connect SDK (https://nexus-playground.pleos.ai). 버전은 Pleos 개발 문서와 같다.
    implementation 'ai.pleos.playground:Vehicle:2.3.2'        // 주행거리, 배터리, 방향지시등, 핸들 각도, 안전벨트, 경고등
    implementation 'ai.pleos.playground:NaviHelper:3.0.5'     // 목적지·남은 거리, 제한속도, 주소, 경유지 추가
    implementation 'ai.pleos.playground:TextToSpeech:3.3.1'   // 주유 추천 음성 안내(ON_DEVICE)
    implementation 'ai.pleos.playground:FusedLocation:1.1.3'  // 현재 위치

    // 판단 로직(주유 감지, 주행, 안전 운전) 단위 테스트: ./gradlew testDebugUnitTest
    testImplementation 'junit:junit:4.13.2'
}
